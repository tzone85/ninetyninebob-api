.0024,101.4883 M209.0024,86.4883 L222.0024,101.4883" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.5049" x="189.25" y="116.5234">Client</text></g><!--entity db--><g class="entity" data-qualified-name="db" data-source-line="21" id="ent0012"><path d="M378.04,826.3983 C378.04,816.3983 501.9985,816.3983 501.9985,816.3983 C501.9985,816.3983 625.957,816.3983 625.957,826.3983 L625.957,868.3748 C625.957,878.3748 501.9985,878.3748 501.9985,878.3748 C501.9985,878.3748 378.04,878.3748 378.04,868.3748 L378.04,826.3983" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M378.04,826.3983 C378.04,836.3983 501.9985,836.3983 501.9985,836.3983 C501.9985,836.3983 625.957,836.3983 625.957,826.3983" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="76.8496" x="388.04" y="853.9334">PostgreSQL</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="227.917" x="388.04" y="870.4217">(users + personal_access_tokens)</text></g><g class="entity" data-qualified-name="GMN22" data-source-line="34" id="ent0023"><path d="M447.19,507.4283 L447.19,639.9127 L762.8038,639.9127 L762.8038,517.4283 L752.8038,507.4283 L447.19,507.4283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M752.8038,507.4283 L752.8038,517.4283 L762.8038,517.4283 L752.8038,507.4283" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.771" x="453.19" y="524.9966">Bug fixes vs original:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.6138" x="453.19" y="540.3072">- register hashes via Hash::make (was a model</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.1563" x="461.4166" y="555.6177">mutator that could be bypassed)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238.2974" x="453.19" y="570.9283">- login no longer logs raw credentials</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.0479" x="453.19" y="586.2388">- login returns generic 'Invalid credentials.'</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.9331" x="461.4166" y="601.5494">instead of leaking unauth state</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.96" x="453.19" y="616.8599">- logout uses bearerToken() fallback when</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.2529" x="461.4166" y="632.1705">currentAccessToken() is a TransientToken</text></g><!--link Client to routes--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="23" id="lnk13"><path d="M209,119.9183 C209,157.4783 209,208.1683 209,240.9783" fill="none" id="Client-to-routes" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="209,246.9783,213,237.9783,209,241.9783,205,237.9783,209,246.9783" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.1987" x="210" y="163.0466">POST /api/register|/login</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="119.8374" x="230.6807" y="178.3572">GET /api/me|/user</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.1382" x="235.5303" y="193.6677">POST /api/logout</text></g><!--link routes to req--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" data-link-type="dependency" data